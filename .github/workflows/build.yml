
name: Build GTA V Mods

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Build ChairEverywhere
      - name: Restore Chair
        run: dotnet restore src/ChairEverywhere.csproj

      - name: Build Chair
        run: dotnet build src/ChairEverywhere.csproj -c Release --no-restore

      # Build StoneAboveHead
      - name: Restore Stone
        run: dotnet restore src/StoneAboveHead.csproj

      - name: Build Stone
        run: dotnet build src/StoneAboveHead.csproj -c Release --no-restore

      # Upload Chair DLL
      - name: Upload Chair DLL
        uses: actions/upload-artifact@v4
        with:
          name: ChairEverywhere-DLL
          path: src/bin/Release/net48/ChairEverywhere.dll

      # Upload Stone DLL
      - name: Upload Stone DLL
        uses: actions/upload-artifact@v4
        with:
          name: StoneAboveHead-DLL
          path: src/bin/Release/net48/StoneAboveHead.dll
