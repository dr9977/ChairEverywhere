
name: Build ChairEverywhere

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/ChairEverywhere.csproj

      - name: Build DLL
        run: dotnet build src/ChairEverywhere.csproj -c Release --no-restore

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ChairEverywhere-DLL
          path: src/bin/Release/net48/ChairEverywhere.dll
